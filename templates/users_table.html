<!-- Users Section -->
<div class="table-responsive">
    <h4>Manage Users</h4>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>ID</th><th>Name</th><th>Email</th><th>Contact Number</th><th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ user.id }}</td>
                <td>{{ user.name }}</td>
                <td>{{ user.email }}</td>
                <td>{{ user.contact_number }}</td>
                <td>
                    <!-- Edit button triggers modal -->
                    <button type="button" class="btn btn-warning btn-sm" data-bs-toggle="modal" data-bs-target="#editUserModal{{ user.id }}">
                        Edit
                    </button>

                    <!-- Delete button -->
                    <form action="{{ url_for('delete_user', user_id=user.id) }}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-danger btn-sm"
                                onclick="return confirm('Are you sure you want to delete this user?');">
                            Delete
                        </button>
                    </form>
                </td>
            </tr>

            <!-- Edit User Modal -->
            <div class="modal fade" id="editUserModal{{ user.id }}" tabindex="-1" aria-labelledby="editUserModalLabel{{ user.id }}" aria-hidden="true">
              <div class="modal-dialog">
                <div class="modal-content bg-dark text-light">
                  <div class="modal-header">
                    <h5 class="modal-title" id="editUserModalLabel{{ user.id }}">Edit User</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                  </div>
                  <form action="{{ url_for('edit_user', user_id=user.id) }}" method="post">
                    <div class="modal-body">
                      <div class="mb-3">
                        <label for="name{{ user.id }}" class="form-label">Name</label>
                        <input type="text" class="form-control" id="name{{ user.id }}" name="name" value="{{ user.name }}" required>
                      </div>
                      <div class="mb-3">
                        <label for="email{{ user.id }}" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email{{ user.id }}" name="email" value="{{ user.email }}" required>
                      </div>
                      <div class="mb-3">
                        <label for="contact{{ user.id }}" class="form-label">Contact Number</label>
                        <input type="text" class="form-control" id="contact{{ user.id }}" name="contact_number" value="{{ user.contact_number }}" required>
                      </div>
                    </div>
                    <div class="modal-footer">
                      <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                      <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                  </form>
                </div>
              </div>
            </div>
            {% endfor %}
        </tbody>
    </table>
</div>
