{% extends "base.html" %}
{% block content %}
<div class="contact-bg page-bg">
  <div class="container page-content py-3"><!-- reduced padding to remove big white gap -->

    <h2 class="mb-4 text-center">Contact Us</h2>
    <p class="lead mb-5 text-center">Reach out for bookings, inquiries, or collaborations.</p>

    <!-- Top two squares -->
    <div class="row mb-4">
      <!-- Left: AI Chatbox -->
      <div class="col-md-6">
        <div class="contact-box p-4 rounded shadow bg-light d-flex flex-column h-100">
          <h4 class="mb-3">Quick Help Chat</h4>
          <!-- Chat area -->
          <div id="chatResponse" class="flex-grow-1 overflow-auto mb-3 p-2" 
               style="max-height:300px; background:#f9f9f9; border-radius:8px;">
            <!-- messages stack here -->
          </div>
          <!-- Input at bottom -->
          <div class="input-group">
            <input type="text" id="userMessage" class="form-control" placeholder="Type your question...">
            <button class="btn btn-primary" onclick="sendMessage()">Send</button>
          </div>
          <!-- Default query buttons -->
          <div class="mt-3 d-flex flex-wrap gap-2">
            <button class="btn btn-outline-primary rounded-pill" onclick="selectQuery('services')">Services</button>
            <!-- <button class="btn btn-outline-primary rounded-pill" onclick="selectQuery('pricing')">Pricing</button> -->
            <button class="btn btn-outline-primary rounded-pill" onclick="selectQuery('support')">Support</button>
            <button class="btn btn-outline-primary rounded-pill" onclick="selectQuery('catalogue')">Price Catalogue</button>
          </div>
        </div>
      </div>

      <!-- Right: Map -->
      <div class="col-md-6">
        <div class="contact-box p-4 rounded shadow bg-light h-100">
          <h4 class="mb-3">Our Location</h4>
          <iframe 
            src="https://www.google.com/maps?q=Ahmedabad,Gujarat&output=embed"
            width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy">
          </iframe>
        </div>
      </div>
    </div>

    <!-- Bottom full-width square -->
    <div class="row">
      <div class="col-md-12">
        <div class="contact-box p-4 rounded shadow bg-light">
          <h4 class="mb-3">Get in Touch</h4>
          <p><strong>Email:</strong> info@avxcinematics.com</p>
          <p><strong>Phone:</strong> +91 98765 43210</p>
          <p><strong>Address:</strong> Ahmedabad, Gujarat, India</p>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- Chatbox Script -->
<script>
const events = {
  "wedding": 2000,
  "engagement": 1500,
  "birthday": 1200,
  "corporate": 2500,
  "pre-wedding": 1800,
  "anniversary": 2000,
  "concert": 3000,
  "fashion": 3500,
  "product": 2800,
  "school": 1500
};

function appendMessage(sender, text, isHTML=false) {
  const responseDiv = document.getElementById("chatResponse");
  const msg = document.createElement("div");
  msg.classList.add("chat-bubble");

  if (sender === "You") {
    msg.classList.add("user-bubble");
    msg.innerHTML = `<strong>You:</strong> ${text}`;
  } else {
    msg.classList.add("ai-bubble");
    msg.innerHTML = isHTML ? text : `<strong>AI:</strong> ${text}`;
  }

  responseDiv.appendChild(msg);
  responseDiv.scrollTop = responseDiv.scrollHeight;
}

function selectQuery(query) {
  // Show the user's choice as a bubble
  appendMessage("You", query.charAt(0).toUpperCase() + query.slice(1));

  if (query === "services") {
    appendMessage("AI", "We offer Wedding, Corporate, Fashion, Concert, and more event cinematics.");
    appendMessage("AI", "Each service includes professional photography and videography.");
    appendMessage("AI", "You can book directly from our Booking page.");
  // } else if (query === "pricing") {
  //   appendMessage("AI", "Pricing depends on the event type.");
  //   appendMessage("AI", "Weddings start at ₹2000, corporate events at ₹2500, etc.");
  //   appendMessage("AI", "Final cost is calculated by hours and services chosen.");
  } else if (query === "support") {
    appendMessage("AI", "You can reach us via email or phone.");
    appendMessage("AI", "We respond within 24 hours to all queries.");
    appendMessage("AI", "For urgent issues, call our helpline directly.");
  } else if (query === "catalogue") {
    let table = "<strong>AI:</strong><table class='table table-sm table-striped mt-2'><thead><tr><th>Event</th><th>Price/hour (₹)</th></tr></thead><tbody>";
    for (const [event, price] of Object.entries(events)) {
      table += `<tr><td>${event.charAt(0).toUpperCase() + event.slice(1)} Event</td><td>${price}</td></tr>`;
    }
    table += "</tbody></table>";
    appendMessage("AI", table, true);
  }
}

function sendMessage() {
  const message = document.getElementById("userMessage").value.trim();
  if (!message) return;
  appendMessage("You", message);

  // Check if user asked for price of an event
  let found = false;
  for (const [event, price] of Object.entries(events)) {
    if (message.toLowerCase().includes(event)) {
      appendMessage("AI", `The price for ${event} event is ₹${price}.`);
      found = true;
      break;
    }
  }

  if (!found) {
    appendMessage("AI", "For further queries you can reach out to us at info@avxcinematics.com or call +91 98765 43210. Thank you for your support!");
  }

  document.getElementById("userMessage").value = "";
}
</script>
{% endblock %}
